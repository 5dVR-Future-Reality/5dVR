<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5dVR | Future Reality</title>
<meta name="theme-color" content="#07070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--ink:#f5f5f7;--muted:#a3a3b2;--pink:#ed135f;--line:#f5f5f7;--glass:rgba(10,10,16,.55);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f6;--ink:#0a0a0a;--muted:#55555f;--line:#0a0a0a;--glass:rgba(244,244,246,.6)}}
:root[data-theme="light"]{--bg:#f4f4f6;--ink:#0a0a0a;--muted:#55555f;--line:#0a0a0a;--glass:rgba(244,244,246,.6)}
html,body{height:100%;height:100dvh;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
 display:flex;justify-content:center;padding:20px 20px 28px;box-sizing:border-box;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 50%,color-mix(in srgb,var(--bg) 78%,transparent),transparent 75%)}
main{width:100%;max-width:440px;text-align:center;perspective:900px;display:flex;flex-direction:column}
.logo{position:relative;width:min(46vw,170px);height:min(46vw,170px);flex:none;margin:auto auto 34px;transform-style:preserve-3d;
 transform:rotateY(calc(var(--mx,0)*32deg)) rotateX(calc(var(--my,0)*-32deg));transition:transform .08s ease-out;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.logo::before{content:"";position:absolute;inset:0;border:3px solid var(--pink);transform:translate3d(16px,16px,-30px);box-shadow:0 0 40px color-mix(in srgb,var(--pink) 55%,transparent)}
.logo img{position:relative;display:block;width:100%;height:100%;object-fit:cover;background:#fff;transform:translateZ(20px)}
.txt{animation:rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both}
.links{animation:rise 1.2s .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1}}
.logo{animation-name:rise}
h1{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(1.35rem,6vw,1.8rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 28px;font-size:1rem}
.links{display:flex;flex-direction:column;gap:14px;margin-top:auto;padding-top:20px}
a{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 22px;border:2px solid var(--line);background:var(--glass);
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);text-decoration:none;font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:1.05rem;overflow:hidden;isolation:isolate;transition:box-shadow .25s,border-color .25s,color .25s}
a::before{content:"";position:absolute;inset:0;background:var(--pink);transform:translateX(-101%);transition:transform .3s ease;z-index:-1}
a:hover,a:focus-visible,a:active{color:#fff;border-color:var(--pink);box-shadow:0 0 36px color-mix(in srgb,var(--pink) 60%,transparent)}
a:hover::before,a:focus-visible::before,a:active::before{transform:none}
a:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
a span{font-family:Manrope,sans-serif;font-weight:600;font-size:.85rem;opacity:.75}
a::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--pink) 45%,transparent),transparent);transform:skewX(-20deg);animation:sheen 4.5s 1.5s infinite;z-index:-1;pointer-events:none}
a:nth-of-type(2)::after{animation-delay:3.3s}
@keyframes sheen{0%,55%{left:-50%}100%{left:130%}}
a:active{transform:scale(.97)}
@media (hover:none){a:hover:not(:active):not(:focus-visible){color:var(--ink);border-color:var(--line);box-shadow:none}a:hover:not(:active):not(:focus-visible)::before{transform:translateX(-101%)}}
.hint{margin:-8px 0 0;padding:0 0 4px;color:var(--muted);font-size:.85rem;font-weight:600;transition:opacity .4s;animation:rise 1.2s .7s cubic-bezier(.2,.8,.2,1) both}
@media (max-height:560px){.logo{width:84px;height:84px;margin:auto auto 14px}h1{font-size:1.1rem}p{display:none}}
@media (prefers-reduced-motion:reduce){.logo,.txt,.links{animation:none}a::before{transition:none}a::after{animation:none}}
</style>
</head>

<script>
(function(){
 var c=document.getElementById('c'),x=c.getContext('2d'),logo=document.getElementById('logo');
 var W,H,dpr,mx=0,my=0,tx=0,ty=0,speed=5,target=.35,t=0,last=0;
 var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 var N=16,D=9,NEAR=.18,fr=[],st=[],i;
 for(i=0;i<N;i++)fr.push(NEAR+i*(D-NEAR)/N);
 for(i=0;i<(innerWidth<600?50:90);i++)st.push({a:Math.random()*6.283,z:Math.random()*D,r:.15+Math.random()*1.1});
 function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
 var bg,pink,line;
 function colors(){bg=cv('--bg');pink=cv('--pink');line=cv('--line')}
 function size(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);colors()}
 addEventListener('resize',size);
 matchMedia('(prefers-color-scheme: light)').addEventListener('change',colors);
 addEventListener('pointermove',function(e){touched=true;tx=e.clientX/W*2-1;ty=e.clientY/H*2-1});
 var tilt=false,rp=[],touched=false,live=false;
 function onTilt(e){if(e.gamma==null)return;live=true;tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,((e.beta||0)-50)/30))}
 function startTilt(){if(tilt)return;tilt=true;addEventListener('deviceorientation',onTilt)}
 if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission!=='function')startTilt();
 addEventListener('pointerdown',function(e){target=2.6;speed=Math.max(speed,3.5);rp.push({x:e.clientX,y:e.clientY,t:0});if(navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
  var hn=document.querySelector('.hint');if(hn)hn.style.opacity=0;
  if(!tilt&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
   try{DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')startTilt()}).catch(function(){})}catch(_){}}});
 addEventListener('pointerup',function(e){target=.35;if(e.pointerType==='touch'){tx=0;ty=0;touched=false}});
 addEventListener('pointercancel',function(){target=.35});
 document.querySelectorAll('a').forEach(function(a){
  a.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')target=1.5});
  a.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')target=.35});
  a.addEventListener('focus',function(){target=1.5});a.addEventListener('blur',function(){target=.35});
 });
 function rgba(hex,al){var h=hex.replace('#','');if(h.length==3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+al+')'}
 function draw(dt){
  t+=dt;if(!touched&&!live){tx=Math.sin(t*.35)*.5;ty=Math.cos(t*.27)*.35}mx+=(tx-mx)*.16;my+=(ty-my)*.16;speed+=(target-speed)*.04;
  document.documentElement.style.setProperty('--mx',mx.toFixed(3));
  document.documentElement.style.setProperty('--my',my.toFixed(3));
  x.globalAlpha=1;x.fillStyle=rgba(bg,.3);x.fillRect(0,0,W,H);
  var base=Math.hypot(W,H)*.2,vx=W/2+mx*W*.24,vy=H/2+my*H*.2;
  var k;
  for(k=0;k<st.length;k++){var s=st[k];s.z-=speed*dt*1.4;if(s.z<NEAR){s.z+=D;s.a=Math.random()*6.283}
   var d1=base*1.6/s.z,d0=base*1.6/(s.z+speed*.12+.02),al=Math.min(1,(1-s.z/D)*1.4);
   x.strokeStyle=rgba(line,al*.5);x.lineWidth=s.r;x.beginPath();
   x.moveTo(vx+Math.cos(s.a)*d0*.9,vy+Math.sin(s.a)*d0*.9);x.lineTo(vx+Math.cos(s.a)*d1*.9,vy+Math.sin(s.a)*d1*.9);x.stroke()}
  for(k=0;k<N;k++){
   fr[k]-=speed*dt;if(fr[k]<NEAR)fr[k]+=D-NEAR;
   var z=fr[k],h=base/z,ang=z*.35+t*.12+mx*.5,
    ox=Math.sin(t*.4+z*.7)*base*.18/ (z*.6+.4),oy=Math.cos(t*.3+z*.6)*base*.12/(z*.6+.4),
    al2=Math.min(1,(1-z/D)*1.5)*Math.min(1,(z-NEAR)*3),
    cx=vx+ox,cy=vy+oy,co=Math.cos(ang),si=Math.sin(ang);
   x.beginPath();
   [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(p,j){var px=p[0]*h,py=p[1]*h,X=cx+px*co-py*si,Y=cy+px*si+py*co;j?x.lineTo(X,Y):x.moveTo(X,Y)});
   x.closePath();
   var isP=k%3===0;
   x.strokeStyle=isP?rgba(pink,al2):rgba(line,al2*.55);
   x.lineWidth=Math.min(6,1+1.6/z);
   x.shadowBlur=isP?18:0;x.shadowColor=pink;
   x.stroke();x.shadowBlur=0;
  }
  for(k=rp.length-1;k>=0;k--){var r=rp[k];r.t+=dt;var p=r.t/.9;if(p>=1){rp.splice(k,1);continue}
   x.strokeStyle=rgba(pink,(1-p)*.9);x.lineWidth=3*(1-p)+1;x.beginPath();x.arc(r.x,r.y,p*Math.max(W,H)*.45,0,6.283);x.stroke()}
 }
 function loop(ts){var dt=Math.min((ts-last)/1000||.016,.05);last=ts;draw(dt);requestAnimationFrame(loop)}
 size();
 if(reduce){speed=0;target=0;for(var q=0;q<20;q++)draw(.05)}else{requestAnimationFrame(loop)}
})();
