:root{--bg:#ffffff;--ink:#0a0a0a;--muted:#6b6b75;--pink:#ed135f;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;margin:0;touch-action:none;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Unbounded,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:56px 26px 60px;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body::before,body::after{content:"";position:fixed;width:34px;height:34px;pointer-events:none}
body::before{left:14px;top:calc(14px + env(safe-area-inset-top,0px));border-left:3px solid var(--ink);border-top:3px solid var(--ink)}
body::after{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
main{width:100%;max-width:400px;display:flex;flex-direction:column;text-align:center}
.logo{position:relative;width:min(62vw,250px);aspect-ratio:274/302;flex:none;margin:auto auto 18px;cursor:pointer;transform-style:preserve-3d;transform:perspective(700px) rotateY(calc(var(--lx,0)*20deg)) rotateX(calc(var(--ly,0)*-20deg));transition:transform .1s ease-out;animation:in .7s backwards,breathe 4s ease-in-out infinite alternate}

p{margin:0;color:var(--muted);font-size:.85rem;font-weight:500;animation:in .7s .1s backwards}
p::after{content:"";display:block;width:36px;height:3px;background:var(--pink);margin:14px auto 0}
.links{display:flex;flex-direction:column;gap:14px;margin-top:auto;padding:28px 6px 6px 0}
a{display:flex;align-items:center;justify-content:center;min-height:58px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem;background:var(--bg);box-shadow:5px 5px 0 var(--pink);transition:transform .12s,box-shadow .12s,background .12s,color .12s;animation:in .6s backwards}
a:nth-child(1){animation-delay:.2s}a:nth-child(2){animation-delay:.3s}a:nth-child(3){animation-delay:.4s}a:nth-child(4){animation-delay:.5s}
a:active{transform:translate(5px,5px);box-shadow:none;background:var(--pink);border-color:var(--pink);color:#fff}
a:focus-visible{background:var(--ink);color:#fff}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (hover:hover){a:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--pink)}}
.float{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.float i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border:2px solid var(--ink);opacity:.22;transform:translate(var(--x),var(--y)) rotate(var(--r));will-change:transform}
.float i.p{border-color:var(--pink);opacity:.65}
.float i.f{background:var(--pink);border:0;opacity:.85}
@keyframes fl{to{transform:translateY(-28px) rotate(calc(var(--r) + 45deg))}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}}
@keyframes sweep{0%,35%{background-position:100% 0,0 0}100%{background-position:0% 0,0 0}}
@keyframes pop{from{opacity:0}}
@keyframes flick{0%,84%,100%{opacity:1}86%{opacity:.35}88%{opacity:1}90%{opacity:.5}92%{opacity:1}}
.logo .b.spin{animation:spinb .9s cubic-bezier(.3,.7,.2,1)}
@media (max-height:600px){.logo{width:min(26vw,100px);margin-bottom:10px}a{min-height:46px}.links{gap:12px;padding-top:14px}}
@media (prefers-reduced-motion:reduce){.logo,p,a,.float i{animation:none}.logo .b.spin,.logo .a,.logo .b{animation:none}}

<body>
<div class="float" aria-hidden="true">
 <i style="--x:9%;--y:17%;--s:26px;--d:9s;--r:15deg"></i>
 <i class="f" style="--x:82%;--y:13%;--s:12px;--d:7s;--r:-20deg"></i>
 <i style="--x:84%;--y:36%;--s:40px;--d:11s;--r:30deg"></i>
 <i class="f" style="--x:7%;--y:50%;--s:14px;--d:8s;--r:0deg"></i>
 <i class="p" style="--x:13%;--y:70%;--s:32px;--d:10s;--r:-10deg"></i>
 <i style="--x:76%;--y:62%;--s:20px;--d:9.5s;--r:45deg"></i>
 <i class="p" style="--x:60%;--y:24%;--s:16px;--d:6.5s;--r:10deg"></i>
</div>
<main>
 <div class="logo" role="img" aria-label="5dVR Future Reality logo"><i class="a"></i><i class="b"></i></div>
 <p>Experience the Fifth Dimension</p>
 <div class="links">
  <a href="https://www.linkedin.com/company/5dvr" target="_blank" rel="noopener">LinkedIn</a>
  <a href="https://www.instagram.com/5dvrfuturereality" target="_blank" rel="noopener">Instagram</a>
  <a href="https://5d-vr.com/" target="_blank" rel="noopener">Website</a>
  <a href="https://www.google.com/maps/search/?api=1&query=1A%2C%202nd%20Floor%2C%2028%20Sama%2C%20Cairo%20Governorate%2C%20Egypt" target="_blank" rel="noopener">Location</a>
 </div>
</main>
<script>
(function(){
 var box=document.querySelector('.float'),W=innerWidth,H=innerHeight,ps=[],fx=-999,fy=-999,t=0,last=0,
  reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function rnd(a,b){return a+Math.random()*(b-a)}
 function add(el,x,y){
  var op=parseFloat(getComputedStyle(el).opacity)||.3;
  ps.push({el:el,s:el.offsetWidth,x:x,y:y,vx:rnd(-8,8),vy:-rnd(8,18),ix:0,iy:0,r:parseFloat(el.style.getPropertyValue('--r'))||0,vr:rnd(-28,28),op:op,pop:0,born:1,ph:rnd(0,6)});
 }
 [].slice.call(box.children).forEach(function(el){
  add(el,parseFloat(el.style.getPropertyValue('--x'))/100*W,parseFloat(el.style.getPropertyValue('--y'))/100*H);
 });
 function draw(p){
  var sc=(1+p.pop*1.6)*p.born;
  p.el.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px) rotate('+p.r.toFixed(1)+'deg) scale('+sc.toFixed(3)+')';
  p.el.style.opacity=(p.op*(1-p.pop)).toFixed(3);
 }
 function respawn(p){p.x=rnd(0,W);p.y=H+p.s;p.ix=p.iy=0;p.pop=0;p.born=0}
 function spawn(x,y){
  if(ps.length>=16){var o=ps.shift();o.el.remove()}
  var el=document.createElement('i'),s=Math.round(rnd(14,38)),k=Math.random();
  el.style.setProperty('--s',s+'px');el.style.setProperty('--x','0px');el.style.setProperty('--y','0px');el.style.setProperty('--r',Math.round(rnd(-40,40))+'deg');
  if(k<.3)el.className='f';else if(k<.6)el.className='p';
  box.appendChild(el);add(el,x-s/2,y-s/2);ps[ps.length-1].born=.2;
 }
 function tick(ts){
  var dt=Math.min((ts-last)/1000||.016,.05);last=ts;t+=dt;
  ps.forEach(function(p,i){
   var cx=p.x+p.s/2,cy=p.y+p.s/2,dx=cx-fx,dy=cy-fy,d=Math.sqrt(dx*dx+dy*dy)||1,R=p.s/2+95;
   if(d<R&&!p.pop){var f=(1-d/R)*1500*dt;p.ix+=dx/d*f;p.iy+=dy/d*f}
   p.ix*=Math.max(0,1-2.2*dt);p.iy*=Math.max(0,1-2.2*dt);
   p.x+=(p.vx+Math.sin(t*.6+p.ph)*10+p.ix)*dt;
   p.y+=(p.vy+p.iy)*dt;p.r+=p.vr*dt;
   if(p.x<-p.s*.3){p.x=-p.s*.3;p.ix=Math.abs(p.ix);p.vx=Math.abs(p.vx)}
   if(p.x>W-p.s*.7){p.x=W-p.s*.7;p.ix=-Math.abs(p.ix);p.vx=-Math.abs(p.vx)}
   if(p.y<-p.s*1.5)respawn(p);
   if(p.y>H+p.s*3){p.y=H+p.s*3;p.iy=0}
   if(p.pop){p.pop+=dt/.35;if(p.pop>=1)respawn(p)}
   if(p.born<1)p.born=Math.min(1,p.born+dt/.6);
   draw(p)});
  requestAnimationFrame(tick);
 }
 addEventListener('resize',function(){W=innerWidth;H=innerHeight});
 addEventListener('pointermove',function(e){fx=e.clientX;fy=e.clientY});
 addEventListener('pointerup',function(e){if(e.pointerType==='touch'){fx=fy=-999}});
 addEventListener('pointercancel',function(){fx=fy=-999});
 addEventListener('pointerdown',function(e){
  fx=e.clientX;fy=e.clientY;
  if(e.target.closest&&e.target.closest('a,.logo'))return;
  var hit=null,best=1e9;
  ps.forEach(function(p){if(p.pop)return;var d=Math.hypot(p.x+p.s/2-fx,p.y+p.s/2-fy);if(d<p.s/2+26&&d<best){best=d;hit=p}});
  if(hit){hit.pop=.001;ps.forEach(function(q){if(q===hit)return;var dx=q.x-hit.x,dy=q.y-hit.y,d=Math.hypot(dx,dy)||1;if(d<220){q.ix+=dx/d*(1-d/220)*260;q.iy+=dy/d*(1-d/220)*260}});
   if(navigator.vibrate){try{navigator.vibrate(8)}catch(_){}}}
  else spawn(fx,fy);
 });
 if(reduce){ps.forEach(draw)}else{requestAnimationFrame(tick)}
})();
</script>
<script>
(function(){
 var lg=document.querySelector('.logo'),vr=lg.querySelector('.b'),W=innerWidth,H=innerHeight,tx=0,ty=0,x=0,y=0,t=0,last=0,idle=true,
  reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,rs=document.documentElement.style;
 addEventListener('resize',function(){W=innerWidth;H=innerHeight});
 addEventListener('pointermove',function(e){idle=false;tx=e.clientX/W*2-1;ty=e.clientY/H*2-1});
 addEventListener('pointerup',function(e){if(e.pointerType==='touch')idle=true});
 addEventListener('pointercancel',function(){idle=true});
 lg.addEventListener('pointerdown',function(){
  vr.classList.remove('spin');void vr.offsetWidth;vr.classList.add('spin');
  if(navigator.vibrate){try{navigator.vibrate(15)}catch(_){}}
  setTimeout(function(){vr.classList.remove('spin')},950);
 });
 function tick(ts){
  var dt=Math.min((ts-last)/1000||.016,.05);last=ts;t+=dt;
  if(idle){tx=Math.sin(t*.7)*.5;ty=Math.cos(t*.5)*.35}
  x+=(tx-x)*.12;y+=(ty-y)*.12;
  lg.style.setProperty('--lx',x.toFixed(3));lg.style.setProperty('--ly',y.toFixed(3));
  requestAnimationFrame(tick);
 }
 if(!reduce)requestAnimationFrame(tick);
})();
</script>
